# SearXNG for the TA System — 23 September.
#
# Suggestions, Benchmark and Research search through this instead of Serper
# (src/lib/serper.ts). It is reachable only from the app container, over
# career141_default; nothing is published to the host, so nothing on the
# internet can ask it anything.
#
# Lives on the server at /opt/ta-prod/searxng/settings.yml. The release
# pipeline copies only docker-compose.yml, so this file is put there by hand
# and is not replaced by a deploy — change it here first, then copy it up.
use_default_settings: true

general:
  instance_name: "Career141 search"
  # Nobody browses this; it answers the app.
  enable_metrics: false

server:
  # Replaced on first install by the command in the README — never commit a real one.
  secret_key: "change-me"
  # The limiter is what makes public instances answer 403 and serve bot checks.
  # This instance is on a private network with one caller, so it is off: with
  # it on, Research's thirty searches per opening would be throttled by us.
  limiter: false
  public_instance: false
  image_proxy: false

search:
  # A CAPTCHA suspends an engine for a day by default. It was a minute while
  # Google answered alone, so the next Research run would work — but on 24 Sep
  # Google had flagged the address itself, and asking again every minute only
  # earned another CAPTCHA. Bing and Yahoo carry the search now, so Google rests
  # for an hour before it is tried again.
  suspended_times:
    SearxEngineCaptcha: 3600
    SearxEngineTooManyRequests: 60
    SearxEngineAccessDenied: 300
  # The JSON API. Off by default, and the reason no public instance could be
  # used (probed 23 Sep: every one served HTML or 403).
  formats:
    - html
    - json
  safe_search: 0
  autocomplete: ""
  default_lang: "en"

outgoing:
  request_timeout: 6.0
  max_request_timeout: 12.0
  pool_connections: 100
  pool_maxsize: 20
  enable_http2: true

# Engines are the default set here, but the app asks Google, Bing and Yahoo
# (SEARXNG_ENGINES, src/lib/serper.ts). Google alone, below, held until 24 Sep,
# when Google sent a CAPTCHA and Research had nothing else to ask. Measured from this server on 23 Sep:
# Google answered with ten results and nothing failed; Brave and Google CSE
# refused the address as "too many requests", DuckDuckGo timed out and Qwant
# sent a CAPTCHA. Waiting on those four cost six seconds on every search, and a
# query where enough of them failed came back empty — which the desk was shown
# as a broken search.
#
# Watch `docker logs ta-prod-searxng` for "CAPTCHA" or "Suspended": if Bing and
# Yahoo start refusing too, the address itself is blocked and SearXNG cannot
# fix it — the next step is a paid source (Serper) or a proxy.
