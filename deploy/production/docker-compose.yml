# The TA System, live, on the production database.
#
# The app only: the database (Convex backend `backend`, Postgres, Qdrant
# `qdrant`) is the CV platform's own stack in ~/career141, reached over its
# network `career141_default`. The screening-call stack (LiveKit + agent) is the
# one staging built, reached over `ta-staging-voice`.
#
#   docker compose -p ta-prod --env-file .env.production up -d
#
# Deployed by .github/workflows/deploy-production.yml, which copies this file to
# /opt/ta-prod/docker-compose.yml. Secrets live only in
# /opt/ta-prod/.env.production on the server (chmod 600).
services:
  app:
    image: ${TA_APP_IMAGE:?set TA_APP_IMAGE}
    container_name: ta-prod-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:3110:3000"
    env_file: .env.production
    environment:
      NODE_ENV: production
      PORT: "3000"
      NEXT_TELEMETRY_DISABLED: "1"
      C141_DEPLOYMENT: production
      C141_CONVEX_HOST: backend
      CONVEX_SELF_HOSTED_URL: http://backend:3210
      QDRANT_URL: http://qdrant:6333
      LIVEKIT_URL: http://livekit:7880
    # The pipeline (deploy/scripts/remote-app.sh) waits for "healthy" before it
    # keeps a new image, and rolls back if it never gets there. /api/health
    # fails only when the database cannot be read (src/app/api/health/route.ts).
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
    networks:
      - career141_default
      - ta-staging-voice

  # Web search for Suggestions, Benchmark and Research (23 Sep). A metasearch
  # front end: it asks Google, Bing, DuckDuckGo and the rest, with no key and
  # no bill, and the app reaches it at http://searxng:8080 — SEARXNG_URL in
  # .env.production. No port is published, so it answers this stack and nothing
  # else; its settings live on the server in ./searxng/settings.yml, which the
  # release pipeline does not touch (it copies only this file).
  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: ta-prod-searxng
    restart: unless-stopped
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
      # Two workers is plenty for one caller; Research fires its searches in
      # parallel, so the threads matter more than the workers.
      UWSGI_WORKERS: "2"
      UWSGI_THREADS: "8"
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks:
      - career141_default

networks:
  career141_default:
    external: true
  ta-staging-voice:
    external: true
