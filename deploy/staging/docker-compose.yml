# TA System — staging, on the live VPS, isolated from production.
#
# Nothing here touches the production project in ~/career141: its own network,
# its own Postgres, its own volumes, and a Convex instance name that cannot
# resolve to production's database (Convex names the database after
# INSTANCE_NAME: "ta-staging" -> database "ta_staging").
#
# Memory is capped on every container, so a runaway import is killed inside
# staging instead of pushing the kernel into killing production processes.
#
# Nothing is published on the public address. Every service listens on
# 127.0.0.1 and is reached over HTTPS through the host's Caddy:
#   https://ta-system.career141.com            app
#   https://ta-system-api.career141.com        Convex backend (admin key)
#   https://ta-system-actions.career141.com    Convex HTTP actions
#   https://ta-system-dashboard.career141.com  Convex dashboard (admin key)
#   https://ta-system-qdrant.career141.com     Qdrant (API key)
# Postgres is only on the Docker network. Secrets come from .env.staging (chmod 600).

name: ta-staging

services:
  postgres:
    image: postgres:16-alpine
    container_name: ta-staging-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: convex
      POSTGRES_PASSWORD: ${STAGING_POSTGRES_PASSWORD:?set in .env.staging}
      POSTGRES_DB: ta_staging
    command: ["postgres", "-c", "shared_buffers=384MB", "-c", "max_connections=100", "-c", "max_wal_size=2GB"]
    volumes:
      - ta-staging-postgres-data:/var/lib/postgresql/data
    mem_limit: 1536m
    mem_reservation: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U convex -d ta_staging"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [ta-staging-net]
    logging: &logs
      driver: json-file
      options: { max-size: "20m", max-file: "3" }

  convex:
    image: ghcr.io/get-convex/convex-backend:latest
    container_name: ta-staging-convex
    restart: unless-stopped
    stop_grace_period: 20s
    stop_signal: SIGINT
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3220:3210"
      - "127.0.0.1:3221:3211"
    environment:
      INSTANCE_NAME: ta-staging
      INSTANCE_SECRET: ${STAGING_INSTANCE_SECRET:?set in .env.staging}
      POSTGRES_URL: postgresql://convex:${STAGING_POSTGRES_PASSWORD}@postgres:5432?sslmode=disable
      DO_NOT_REQUIRE_SSL: "true"
      CONVEX_CLOUD_ORIGIN: https://ta-system-api.career141.com
      CONVEX_SITE_ORIGIN: https://ta-system-actions.career141.com
      DISABLE_BEACON: "true"
      APPLICATION_MAX_CONCURRENT_MUTATIONS: "8"
      APPLICATION_MAX_CONCURRENT_NODE_ACTIONS: "4"
      APPLICATION_MAX_CONCURRENT_V8_ACTIONS: "4"
    volumes:
      - ta-staging-convex-files:/convex/data
    mem_limit: 5g
    memswap_limit: 5g
    mem_reservation: 1g
    networks: [ta-staging-net]
    logging: *logs

  convex-dashboard:
    image: convex-dashboard:working
    container_name: ta-staging-convex-dashboard
    restart: unless-stopped
    ports:
      - "127.0.0.1:6792:6791"
    environment:
      NEXT_PUBLIC_DEPLOYMENT_URL: https://ta-system-api.career141.com
      PORT: "6791"
      HOSTNAME: 0.0.0.0
    depends_on: [convex]
    mem_limit: 512m
    networks: [ta-staging-net]
    logging: *logs

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ta-staging-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6336:6333"
      - "127.0.0.1:6337:6334"
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?set in .env.staging}
    volumes:
      - ta-staging-qdrant-data:/qdrant/storage
    mem_limit: 1536m
    networks: [ta-staging-net]
    logging: *logs

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:?set in .env.staging}
    # The pipeline sets TA_APP_IMAGE to the commit's image (staging-<commit>)
    # and retags it :staging once healthy, so a plain `docker compose up` runs
    # the last good version. `up --build` on the server builds :staging locally.
    image: ${TA_APP_IMAGE:-ghcr.io/career141-dev/ta-system:staging}
    container_name: ta-staging-app
    restart: unless-stopped
    depends_on: [convex, qdrant]
    ports:
      - "127.0.0.1:3110:3100"
    env_file: [.env.staging]
    environment:
      NODE_OPTIONS: "--max-old-space-size=768"
      # Staging names its backend explicitly and keeps the safety check: the app
      # refuses to start unless Convex has crons off and the outbound lock on.
      C141_DEPLOYMENT: staging
      C141_CONVEX_HOST: convex
      CONVEX_SELF_HOSTED_URL: http://convex:3210
      QDRANT_URL: http://qdrant:6333
    mem_limit: 1g
    mem_reservation: 256m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/signin').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks: [ta-staging-net]
    logging: *logs

  # ── the screening call: staging's own copy of the CV platform's voice stack ──
  #
  # Same three parts as ~/career141 (LiveKit, its Redis, the agent), on ports
  # of staging's own so production's server keeps 7880/7881, 3478, 5349 and
  # 50000-50200. Nothing here reaches production, and production reaches
  # nothing here: a call made from staging is served by staging's own agent.
  #
  # Only the signalling port is published to the host, on loopback, and the
  # browser reaches it over HTTPS through the host's Caddy
  # (ta-system-voice.career141.com). The media ports have to be public, as
  # they are for production, because audio flows to the browser directly.
  voice-redis:
    image: redis:7.4-alpine
    container_name: ta-staging-voice-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${STAGING_VOICE_REDIS_PASSWORD:?set in .env.staging}", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${STAGING_VOICE_REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: 256m
    networks: [ta-staging-voice]
    logging: *logs

  livekit:
    image: livekit/livekit-server:v1.13.4
    container_name: ta-staging-livekit
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    depends_on:
      voice-redis:
        condition: service_healthy
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?set in .env.staging}: ${LIVEKIT_API_SECRET:?set in .env.staging}"
      LIVEKIT_REDIS_PASSWORD: ${STAGING_VOICE_REDIS_PASSWORD}
    ports:
      - "127.0.0.1:7890:7880"
      - "7891:7881"
      - "3479:3478/udp"
      - "5350:5349/tcp"
      - "50300-50400:50300-50400/udp"
    volumes:
      # Paths here are relative to this file, not to the repository root.
      - ./livekit.yaml:/etc/livekit.yaml:ro
    healthcheck:
      disable: true
    stop_grace_period: 6m
    mem_limit: 512m
    mem_reservation: 128m
    networks: [ta-staging-net, ta-staging-voice]
    logging: *logs

  voice-agent:
    build:
      context: ../../voice-agent
    image: ghcr.io/career141-dev/ta-system-voice-agent:staging
    container_name: ta-staging-voice-agent
    restart: unless-stopped
    init: true
    depends_on:
      livekit:
        condition: service_started
    environment:
      NODE_OPTIONS: "--max-old-space-size=512"
      NODE_ENV: production
      # Inside the compose network, so the agent never leaves the machine to
      # reach its own server.
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      # Aura runs entirely on OpenAI Realtime (24 Sep); no Deepgram key.
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set in .env.staging}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      AURA_REALTIME_MODEL: ${AURA_REALTIME_MODEL:-}
      AURA_REALTIME_VOICE: ${AURA_REALTIME_VOICE:-}
      AURA_INTERRUPT_MS: ${AURA_INTERRUPT_MS:-}
      AURA_SILENCE_MS: ${AURA_SILENCE_MS:-}
      AURA_VAD_THRESHOLD: ${AURA_VAD_THRESHOLD:-}
      AURA_AGENT_NAME: ${AURA_AGENT_NAME:-career141-aura}
      AURA_HEALTH_PORT: "8082"
    command: ["node", "dist/index.js", "start"]
    ports:
      - "127.0.0.1:18082:8082"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8082/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    stop_grace_period: 6m
    mem_limit: 1g
    mem_reservation: 256m
    networks: [ta-staging-voice]
    logging: *logs

volumes:
  ta-staging-postgres-data:
    name: ta-staging-postgres-data
  ta-staging-convex-files:
    name: ta-staging-convex-files
  ta-staging-qdrant-data:
    name: ta-staging-qdrant-data
    external: true

networks:
  ta-staging-net:
    name: ta-staging-net
  # The call's own network: Redis and the agent are never reachable from the
  # app's network, and nothing on it is published except LiveKit's own ports.
  ta-staging-voice:
    name: ta-staging-voice
