# The staging call server, for the host's Caddy (/etc/caddy/Caddyfile).
#
# LiveKit's signalling port is bound to loopback (127.0.0.1:7890), exactly as
# production binds its own to 127.0.0.1:7880, so it is never public directly.
# Caddy terminates HTTPS and upgrades the WebSocket the call runs on.
#
# Add this block to /etc/caddy/Caddyfile, then `caddy validate` and
# `systemctl reload caddy`. It adds a site; it changes none of the existing
# ones, including the production sites.
#
#   https://ta-system-voice.career141.com/ready  -> "OK" when LiveKit is up
ta-system-voice.career141.com {
	@ready path /ready
	handle @ready {
		rewrite * /
		reverse_proxy 127.0.0.1:7890
	}

	handle {
		reverse_proxy 127.0.0.1:7890
	}
}
