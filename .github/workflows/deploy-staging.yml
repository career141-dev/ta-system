name: Deploy Staging

# main is the development line. Every push to it is checked and, if it passes,
# deployed to staging — https://ta-system.career141.com — with its Convex
# functions. Staging holds a copy of real data with crons off and outbound
# locked, so nothing here reaches a candidate or a live mailbox.
#
# Run it by hand (Actions → Deploy Staging → Run workflow) to deploy only the
# app or only Convex, to redeploy an older commit, or to run a one-off Convex
# function such as a migration.

#
# PAUSED 21 Sep: no automatic deploy on push. ta-system.career141.com is now
# PRODUCTION (deploy-production.yml), and the staging database is gone. Pushing
# to main used to replace the container on 127.0.0.1:3110 — which is now the
# live app — so the push trigger stays off until a new staging exists with its
# own port and database. Run by hand only once that is so.
on:
  workflow_dispatch:
    inputs:
      components:
        description: What to deploy
        type: choice
        options: [all, app, convex]
        default: all
      ref:
        description: Branch, tag or commit (empty = the branch selected above)
        type: string
        default: ""
      run_function:
        description: Convex function to run after deploying (optional, e.g. migrations/foo:run)
        type: string
        default: ""
      run_args:
        description: JSON arguments for that function
        type: string
        default: "{}"

permissions:
  contents: read
  packages: write

concurrency:
  group: pipeline-staging
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve commit
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  ci:
    name: CI
    needs: resolve
    uses: ./.github/workflows/ci.yml
    with:
      build: false
      ref: ${{ needs.resolve.outputs.sha }}

  deploy:
    name: Staging
    needs: [resolve, ci]
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      environment: staging
      ref: ${{ needs.resolve.outputs.sha }}
      components: ${{ inputs.components || 'all' }}
      run_function: ${{ inputs.run_function || '' }}
      run_args: ${{ inputs.run_args || '{}' }}
      # Where staging lives on the VPS (docs/STAGING.md).
      deploy_dir: /opt/ta-staging-src
      env_file: .env.staging
      compose_source: deploy/staging/docker-compose.yml
      app_service: app
      app_container: ta-staging-app
      health_url: http://127.0.0.1:3110/signin
      convex_port: "3220"
