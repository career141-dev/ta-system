name: Deploy Staging

on:
  push:
    branches:
      - staging

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=staging

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Public, and baked into the browser bundle: set it as a repository secret.
          build-args: |
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}

  deploy-to-vps:
    needs: build-and-push-image
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Staging lives in /opt/ta-staging-src with its own compose project
          # (deploy/staging/docker-compose.yml, docs/STAGING.md). Only the app is
          # replaced here; Convex functions are deployed separately, and the
          # database, Postgres and Qdrant are never touched by this job.
          script: |
            set -e
            cd /opt/ta-staging-src
            docker compose --env-file .env.staging pull app
            docker compose --env-file .env.staging up -d --no-deps app

            echo "Waiting for the app to start..."
            for i in $(seq 1 30); do
              if curl -fs -o /dev/null http://localhost:3110/signin; then echo "Deployment successful."; exit 0; fi
              sleep 5
            done
            echo "Health check failed!"
            docker logs --tail 50 ta-staging-app
            exit 1
