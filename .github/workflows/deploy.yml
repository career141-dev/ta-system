name: Deploy (shared)

# The one deployment procedure, used by both "Deploy Staging" and
# "Deploy Production". Each caller says which environment and where it lives on
# the server; the steps are identical, so staging rehearses exactly what
# production will run.
#
#   1. build   The app image is built on GitHub's runner (not on the VPS, which
#              is shared with the live system) and pushed to GHCR, tagged
#              <environment>-<commit>.
#   2. deploy  One job, in the GitHub Environment, so a protected environment
#              asks for approval once:
#              a. backup     (optional) pg_dump of the Convex database on the server
#              b. convex     settings pinned in deploy/convex-env, required
#                            settings checked, functions + schema deployed,
#                            optional one-off function (a migration), smoke check
#              c. app        pull the image, restart only the app container,
#                            wait for healthy, roll back to the previous image
#                            if it never gets there
#
# The Convex backend is never exposed for this: the runner reaches it through
# an SSH tunnel to its loopback port on the server.

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub Environment name (staging or production).
        type: string
        required: true
      ref:
        description: Commit to deploy.
        type: string
        required: true
      components:
        description: all, app or convex.
        type: string
        default: all
      deploy_dir:
        description: Folder on the server holding the compose file and the env file.
        type: string
        required: true
      env_file:
        description: Env file inside deploy_dir (secrets for the app; stays on the server).
        type: string
        required: true
      compose_source:
        description: Compose file in this repository copied to deploy_dir/docker-compose.yml on each deploy. Empty to leave the server's file alone.
        type: string
        default: ""
      app_service:
        type: string
        default: app
      app_container:
        type: string
        required: true
      health_url:
        description: URL checked on the server once the container reports healthy.
        type: string
        required: true
      convex_port:
        description: Loopback port of the Convex backend on the server.
        type: string
        required: true
      run_function:
        description: Optional Convex function to run after the functions deploy (e.g. a migration).
        type: string
        default: ""
      run_args:
        type: string
        default: "{}"
      backup_postgres_container:
        description: Postgres container holding the Convex database. Empty skips the backup.
        type: string
        default: ""
      backup_postgres_db:
        type: string
        default: ""
      backup_postgres_user:
        type: string
        default: convex
    # Secrets come with `secrets: inherit`:
    #   repository   VPS_HOST, VPS_USERNAME, VPS_SSH_KEY,
    #                NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY (staging),
    #                PRODUCTION_CLERK_PUBLISHABLE_KEY
    #   environment  CONVEX_SELF_HOSTED_ADMIN_KEY — one per GitHub Environment,
    #                read by the deploy job because it runs in that environment

permissions:
  contents: read
  packages: write

env:
  IMAGE_REPO: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build app image
    if: ${{ inputs.components != 'convex' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image: ${{ steps.tag.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Image tag
        id: tag
        run: |
          repo=$(echo "$IMAGE_REPO" | tr '[:upper:]' '[:lower:]')
          sha=$(git rev-parse --short=12 HEAD)
          echo "image=$repo:${{ inputs.environment }}-$sha" >> "$GITHUB_OUTPUT"
          echo "channel=$repo:${{ inputs.environment }}" >> "$GITHUB_OUTPUT"

      - name: Clerk key present
        env:
          KEY: ${{ inputs.environment == 'production' && secrets.PRODUCTION_CLERK_PUBLISHABLE_KEY || secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::The Clerk publishable key for ${{ inputs.environment }} is not set (see docs/CI-CD.md)."
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.tag.outputs.image }}
            ${{ steps.tag.outputs.channel }}
          build-args: |
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ inputs.environment == 'production' && secrets.PRODUCTION_CLERK_PUBLISHABLE_KEY || secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          cache-from: type=gha,scope=app-${{ inputs.environment }}
          cache-to: type=gha,mode=max,scope=app-${{ inputs.environment }}

  deploy:
    name: Deploy to ${{ inputs.environment }}
    needs: build
    # Runs when the build ran and passed, or was skipped for a Convex-only deploy.
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      DEPLOY_ENV: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: SSH access
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.VPS_KNOWN_HOSTS }}
          HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" >> ~/.ssh/known_hosts
          else
            echo "::warning::VPS_KNOWN_HOSTS is not set; trusting the host key found now. Set it to pin the server's key."
            ssh-keyscan -t ed25519 "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          cat >> ~/.ssh/config <<EOF
          Host deploy-target
            HostName $HOST
            User ${{ secrets.VPS_USERNAME }}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            ServerAliveInterval 30
            StrictHostKeyChecking yes
          EOF
          ssh deploy-target "mkdir -p '${{ inputs.deploy_dir }}/.deploy' && test -f '${{ inputs.deploy_dir }}/${{ inputs.env_file }}'" \
            || { echo "::error::${{ inputs.deploy_dir }}/${{ inputs.env_file }} is missing on the server."; exit 1; }
          scp -q deploy/scripts/remote-app.sh deploy/scripts/remote-backup.sh deploy-target:'${{ inputs.deploy_dir }}/.deploy/'

      - name: Back up the Convex database
        if: ${{ inputs.backup_postgres_container != '' && inputs.components != 'app' }}
        run: |
          ssh deploy-target "bash '${{ inputs.deploy_dir }}/.deploy/remote-backup.sh' \
            '${{ inputs.environment }}' '${{ inputs.backup_postgres_container }}' \
            '${{ inputs.backup_postgres_user }}' '${{ inputs.backup_postgres_db }}' '${{ inputs.ref }}'"

      - uses: actions/setup-node@v4
        if: ${{ inputs.components != 'app' }}
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: ${{ inputs.components != 'app' }}
        run: npm ci

      - name: Deploy Convex (settings, schema, functions)
        if: ${{ inputs.components != 'app' }}
        env:
          CONVEX_SELF_HOSTED_ADMIN_KEY: ${{ secrets.CONVEX_SELF_HOSTED_ADMIN_KEY }}
          CONVEX_REMOTE_PORT: ${{ inputs.convex_port }}
          RUN_FUNCTION: ${{ inputs.run_function }}
          RUN_ARGS: ${{ inputs.run_args }}
        run: bash deploy/scripts/convex-deploy.sh

      - name: Deploy the app
        if: ${{ inputs.components != 'convex' }}
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ inputs.compose_source }}" ]; then
            scp -q "${{ inputs.compose_source }}" deploy-target:'${{ inputs.deploy_dir }}/docker-compose.yml'
          fi
          # The registry token goes over stdin, never on a command line.
          printf '%s\n%s\n' "$GHCR_USER" "$GHCR_TOKEN" | ssh deploy-target "bash '${{ inputs.deploy_dir }}/.deploy/remote-app.sh' \
            '${{ inputs.deploy_dir }}' '${{ inputs.env_file }}' '${{ inputs.app_service }}' '${{ inputs.app_container }}' \
            '${{ needs.build.outputs.image }}' '${{ inputs.health_url }}' '${{ inputs.environment }}'"

      - name: Record
        if: ${{ success() }}
        run: |
          ssh deploy-target "echo \"\$(date -u +%FT%TZ) ${{ inputs.ref }} components=${{ inputs.components }} by=${{ github.actor }} run=${{ github.run_id }}\" >> '${{ inputs.deploy_dir }}/.deploy/history.log'"
          {
            echo "### Deployed to ${{ inputs.environment }}"
            echo "- Commit: \`${{ inputs.ref }}\`"
            echo "- Components: ${{ inputs.components }}"
            [ -n "${{ needs.build.outputs.image }}" ] && echo "- Image: \`${{ needs.build.outputs.image }}\`"
            [ -n "${{ inputs.run_function }}" ] && echo "- Ran: \`${{ inputs.run_function }}\`"
            true
          } >> "$GITHUB_STEP_SUMMARY"
