name: Deploy Production

# The `production` branch is what runs live — https://ta-system.career141.com
# on the live database (api.career141.com). A release is a fast-forward of
# production to a commit that is already on main:
#
#   git push origin main:production
#
# Three locks before anything is touched:
#   1. PRODUCTION_ENABLED (repository variable) must be "true". It is off until
#      the production target is provisioned and approved (docs/CI-CD.md).
#   2. The commit must already be on main.
#   3. The "production" GitHub Environment requires a reviewer to approve the
#      deploy job, and allows only the production branch.
#
# A database backup is taken first only when the release runs a function (a
# migration) or a manual run asks for one (backup: always). The owner takes a
# backup each morning, so ordinary releases skip the 15-minute dump.
# Production settings (where it lives on the server) are repository variables,
# so they can be set when the target exists without changing this file.

on:
  push:
    branches: [production]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      components:
        description: What to deploy
        type: choice
        options: [all, app, convex]
        default: all
      run_function:
        description: Convex function to run after deploying (optional, e.g. migrations/foo:run)
        type: string
        default: ""
      run_args:
        description: JSON arguments for that function
        type: string
        default: "{}"
      backup:
        description: Database backup first (auto = only when a function runs)
        type: choice
        options: [auto, always]
        default: auto

permissions:
  contents: read
  packages: write

concurrency:
  group: pipeline-production
  cancel-in-progress: false

jobs:
  gate:
    name: Release checks
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.check.outputs.sha }}
      backup: ${{ steps.backup.outputs.need }}
    steps:
      - name: Production enabled
        if: ${{ vars.PRODUCTION_ENABLED != 'true' }}
        run: |
          echo "::error::Production deploys are switched off (repository variable PRODUCTION_ENABLED is not 'true'). See docs/CI-CD.md."
          exit 1

      - name: Only from the production branch
        if: ${{ github.ref != 'refs/heads/production' }}
        run: |
          echo "::error::Run this workflow on the production branch."
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: The commit has been through main (and staging)
        id: check
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$(git rev-parse --short HEAD) is not on main. Merge to main first, let staging deploy it, then fast-forward production."
            exit 1
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # A full dump of the 15 GB database takes about 15 minutes. The owner
      # takes a backup each morning, so a release takes one only when it runs
      # a one-off function (a migration, which rewrites stored rows) or a
      # manual run asks for it (`backup: always`). A schema change alone no
      # longer does: the schema only ever gains optional fields, which change
      # no stored row. (Owner's decision, 21 September — twice.)
      # A function run with "dryRun": true only reads, so it takes none either:
      # the dump was most of every dry run's 25 minutes (owner, 26 October).
      # `backup: always` still forces one.
      - name: Does this release need a database backup?
        id: backup
        env:
          FORCE: ${{ inputs.backup }}
          RUN_FUNCTION: ${{ inputs.run_function }}
          RUN_ARGS: ${{ inputs.run_args }}
        run: |
          need=false
          if [ "$FORCE" = "always" ]; then
            need=true
          elif [ -n "$RUN_FUNCTION" ] && ! printf '%s' "$RUN_ARGS" | grep -Eq '"dryRun"[[:space:]]*:[[:space:]]*true'; then
            need=true
          fi
          echo "need=$need" >> "$GITHUB_OUTPUT"
          echo "Database backup before this release: $need"

  ci:
    name: CI
    needs: gate
    uses: ./.github/workflows/ci.yml
    with:
      build: false
      ref: ${{ needs.gate.outputs.sha }}

  deploy:
    name: Production
    needs: [gate, ci]
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      environment: production
      ref: ${{ needs.gate.outputs.sha }}
      components: ${{ inputs.components || 'all' }}
      run_function: ${{ inputs.run_function || '' }}
      run_args: ${{ inputs.run_args || '{}' }}
      # Where production lives (21 Sep): the app in /opt/ta-prod, on the CV
      # platform's Convex backend (loopback 3210) and its Postgres. A repository
      # variable still overrides each, should the server layout change.
      deploy_dir: ${{ vars.PRODUCTION_DEPLOY_DIR || '/opt/ta-prod' }}
      env_file: ${{ vars.PRODUCTION_ENV_FILE || '.env.production' }}
      compose_source: ${{ vars.PRODUCTION_COMPOSE_SOURCE || 'deploy/production/docker-compose.yml' }}
      app_service: ${{ vars.PRODUCTION_APP_SERVICE || 'app' }}
      app_container: ${{ vars.PRODUCTION_APP_CONTAINER || 'ta-prod-app' }}
      health_url: ${{ vars.PRODUCTION_HEALTH_URL || 'http://127.0.0.1:3110/signin' }}
      convex_port: ${{ vars.PRODUCTION_CONVEX_PORT || '3210' }}
      backup_postgres_container: ${{ needs.gate.outputs.backup == 'true' && (vars.PRODUCTION_POSTGRES_CONTAINER || 'career141-postgres-1') || '' }}
      backup_postgres_db: ${{ vars.PRODUCTION_POSTGRES_DB || 'convex_self_hosted' }}
      backup_postgres_user: ${{ vars.PRODUCTION_POSTGRES_USER || 'convex' }}
